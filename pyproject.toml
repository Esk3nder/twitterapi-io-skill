[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF"]
ignore = [
    "A001", "A002",  # `credits` is the API's billing unit; the builtin is a REPL helper
    "N818",          # CostLimitExceeded is a public name callers already catch
]

[tool.ruff.lint.per-file-ignores]
# Tests name sets A/B and alias Client as C to mirror the cases they describe.
"tests/**" = ["N802", "N805", "N806", "N817", "SIM117"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
